server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Relative redirects: nginx listens on 80 but is published on another host
    # port, so absolute ones would send the browser to http://localhost/...
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in asset file names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: any other path gets index.html. index.html itself must
    # not be cached, or users would keep loading old asset hashes after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
