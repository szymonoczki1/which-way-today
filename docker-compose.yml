# docker compose up --build
#   frontend: http://localhost:5173   backend: http://localhost:8000
#
# Zero config. Optional overrides (shell env or a root .env file):
#   BACKEND_PORT, FRONTEND_PORT  host ports (e.g. if 8000 is already taken)
#   OPENAI_API_KEY               enables AI recommendations; rule-based without it
#
# The frontend's API URL and the backend's CORS origins are derived from the two
# ports, so they can't drift apart.

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/whichway.db
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - db-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Read by the browser, so it's the host-published port, not http://backend:8000.
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
